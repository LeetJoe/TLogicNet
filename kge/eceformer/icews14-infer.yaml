job.type: train
dataset.name: icews14
model: eceformer

random_seed:
  python: 333
  torch: 339
  numpy: 333

eval:
  batch_size: 2048
  metrics_per:
    relation_type: true
  trace_level: example
  num_workers: 0
  pin_memory: true

dataset:
  files:
    train:
      filename: trainids_aug.txt
      type: triples
    valid:
      filename: validids.txt
      type: triples
    test:
      filename: testids.txt
      type: triples
    infer:
      filename: inferids.txt
      type: triples

    entity_ids:
      filename: entitymap.txt
      type: map
    relation_ids:
      filename: relationmap.txt
      type: map
    time_ids:
      filename: timemap.txt
      type: map

    entity_strings:
      filename: entitymap.txt
      type: map
    relation_strings:
      filename: relationmap.txt
      type: map
    time_strings:
      filename: timemap.txt
      type: map
  pickle: False

train:
  loss: kl
  auto_correct: true
  batch_size: 2048
  max_epochs: 300
  continue_epochs: 100
  lr_scheduler: "" #set empty here to use schedule below
  loss_arg: .nan # disable label smoothing
  optimizer: Adamax  # Adadelta，试试 Adam？
  optimizer_args:
    lr: 0.01
    warmup: 0.1
    schedule: warmup_linear_xdl
    eps: 1e-6
    weight_decay: 0.01
    max_grad_norm: 1.0
  type: 1vsAll
  num_workers: 0
  pin_memory: true
lookup_embedder:
  dim: 320
  dropout: 0.
  initialize: normal_
  initialize_args:
    normal_:
      std: 0.02
eceformer:
  transformer_impl: huggingface
  activation: gelu
  hidden_dropout: 0.1
  attn_dropout: 0.1
  ctx_dropout: 0.3
  self_dropout: 0.5
  max_context_size: 50
  mlm_mask: 1.0
  mlm_replace: 0.3 # no effect since mlm_mask=1
  add_mlm_loss: true
  output_dropout: 0.6
  nlayer: 6
  nhead: 8
  ff_dim: 1024
valid:
  early_stopping:
    min_threshold:
      epochs: 50
      metric_value: 0.05
    patience: 50
infer:
  batch_size: 4096
  num_workers: 0
  pin_memory: true